# Render Blueprint: bitta web servis (API + web + Telegram bot webhook) + PostgreSQL
services:
  - type: web
    name: fudbol-analiz
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATA_PROVIDER
        value: mock
      - key: BOT_TOKEN
        sync: false # Render panelida qo'lda kiriting
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fudbol-analiz-db
          property: connectionString

databases:
  - name: fudbol-analiz-db
    plan: free
